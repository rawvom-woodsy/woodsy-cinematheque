<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>비밀번호 변경 · WOODSY</title>
<style>body{margin:0;background:#f6f1e7;color:#171614;font:15px/1.75 system-ui,"Noto Sans KR",sans-serif}.wrap{max-width:530px;margin:9vh auto;padding:28px}h1{font-size:30px;line-height:1.35}.eyebrow{color:#8a2c2c;letter-spacing:.12em;font-size:12px;font-weight:bold}input,button{display:block;width:100%;padding:14px;box-sizing:border-box;font:inherit;margin:12px 0;border:1px solid #d8d0c3;border-radius:3px;background:#fbf8f1}button{background:#8a2c2c;color:#fff;cursor:pointer;border:0}button:disabled{opacity:.5}#message{white-space:pre-wrap}a{color:#8a2c2c}</style></head>
<body><main class="wrap"><div class="eyebrow">WOODSY · ACCOUNT SECURITY</div><h1>비밀번호 변경</h1><p>현재 로그인된 관리자 계정의 비밀번호를 새로 설정합니다. 변경을 마칠 때까지 로그아웃하지 마세요.</p>
<div id="status">로그인 상태 확인 중…</div>
<form id="form" hidden><label>새 비밀번호<input id="pass" type="password" autocomplete="new-password" minlength="8" required placeholder="8자 이상"></label><label>새 비밀번호 확인<input id="confirm" type="password" autocomplete="new-password" minlength="8" required></label><button id="submit" type="submit">새 비밀번호 저장</button></form>
<p id="message" role="status"></p><p><a href="./#admin">관리자 편집실로 돌아가기</a></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async function(){
const status=document.getElementById('status'),msg=document.getElementById('message'),form=document.getElementById('form');
try{
 if(!window.supabase)throw Error('인증 라이브러리를 불러오지 못했습니다.');
 const client=window.supabase.createClient('https://jbsjjmmlqzxsuxgvvnfq.supabase.co','sb_publishable_fCFNPFfNZ28XTcOCjnngIA_jxlSLfmi');
 const result=await client.auth.getUser();
 if(result.error||!result.data.user){status.textContent='로그인 세션이 없습니다. 재설정 링크를 열었던 동일한 브라우저에서 시도해 주세요.';return;}
 status.textContent='인증됨 · '+result.data.user.email;
 form.hidden=false;
 form.addEventListener('submit',async e=>{
 e.preventDefault();msg.textContent='';
 const pass=document.getElementById('pass').value,confirmation=document.getElementById('confirm').value;
 if(pass.length<8){msg.textContent='비밀번호는 8자 이상이어야 합니다.';return;}
 if(pass!==confirmation){msg.textContent='입력한 두 비밀번호가 일치하지 않습니다.';return;}
 const btn=document.getElementById('submit');btn.disabled=true;
 try{const {error}=await client.auth.updateUser({password:pass});if(error)throw error;msg.textContent='비밀번호가 변경되었습니다. 이제 새 비밀번호로 로그인할 수 있습니다.';form.reset();}
 catch(error){msg.textContent='변경 실패: '+error.message;}
 finally{btn.disabled=false;}
 });
}catch(e){status.textContent='인증 확인 실패';msg.textContent=e.message;}
})();
</script></body></html>
